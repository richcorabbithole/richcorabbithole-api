service: richcorabbithole-api
org: richcorabbithole

# Exclude CLI scripts and docs from Lambda package to reduce size and cold-start time
package:
  patterns:
    - '!scripts/**'
    - '!docs/**'
    - '!tests/**'
    - '!.gitignore'
    - '!README.md'

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: richcorabbithole-api-deploys-${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:us-east-1:444739497441:secret:richcorabbithole/anthropic-api-key-*
            - arn:aws:secretsmanager:us-east-1:444739497441:secret:richcorabbithole/github-app-*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: arn:aws:s3:::${self:custom.bucketName}/*
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: arn:aws:s3:::${self:custom.bucketName}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:us-east-1:444739497441:table/${self:custom.tableName}
            - arn:aws:dynamodb:us-east-1:444739497441:table/${self:custom.tableName}/index/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - !GetAtt ResearchQueue.Arn
            - !GetAtt WriteQueue.Arn
            - !GetAtt EditQueue.Arn
            - !GetAtt SeoQueue.Arn
            - !GetAtt PublishQueue.Arn
  tags:
    Project: richcorabbithole
    Environment: ${self:provider.stage}
    ManagedBy: serverless

custom:
  stage: ${self:provider.stage}
  bucketName: richcorabbithole-research-${self:custom.stage}
  tableName: richcorabbithole-tasks-${self:custom.stage}
  certificateArn: arn:aws:acm:us-east-1:444739497441:certificate/3afa4bdc-fde3-4f80-abe3-0fdcbb91ebfe
  domainMap:
    dev: dev-api.richcorabbithole.com
    prod: api.richcorabbithole.com
  domainName: ${self:custom.domainMap.${self:custom.stage}}

functions:
  hello:
    handler: src/hello.handler
    events:
      - http:
          path: /hello
          method: get

  # Thin accept function: validates input, creates task record, queues work, returns immediately
  research:
    handler: src/research.handler
    timeout: 10
    memorySize: 256
    environment:
      TABLE_NAME: ${self:custom.tableName}
      RESEARCH_QUEUE_URL: !Ref ResearchQueue
      STAGE: ${self:custom.stage}
    events:
      - http:
          path: /research
          method: post
          authorizer: aws_iam

  # Worker function: triggered by SQS, does the actual Claude research (up to 15 min)
  researchWorker:
    handler: src/researchWorker.handler
    timeout: 900
    memorySize: 1024
    environment:
      BUCKET_NAME: ${self:custom.bucketName}
      TABLE_NAME: ${self:custom.tableName}
      SECRET_ID: richcorabbithole/anthropic-api-key
      STAGE: ${self:custom.stage}
      WRITE_QUEUE_URL: !Ref WriteQueue
    events:
      - sqs:
          arn: !GetAtt ResearchQueue.Arn
          batchSize: 1
  # Worker function: triggered by SQS, does the Draft writing as well as revisions (up to 15 min)
  writeWorker:
    handler: src/writeWorker.handler
    timeout: 900
    memorySize: 1024
    environment:
      BUCKET_NAME: ${self:custom.bucketName}
      TABLE_NAME: ${self:custom.tableName}
      SECRET_ID: richcorabbithole/anthropic-api-key
      STAGE: ${self:custom.stage}
      EDIT_QUEUE_URL: !Ref EditQueue
    events:
      - sqs:
          arn: !GetAtt WriteQueue.Arn
          batchSize: 1

  # Worker function: triggered by SQS, edits/polishes a draft (up to 3 min)
  editWorker:
    handler: src/editWorker.handler
    timeout: 180
    memorySize: 512
    environment:
      BUCKET_NAME: ${self:custom.bucketName}
      TABLE_NAME: ${self:custom.tableName}
      SECRET_ID: richcorabbithole/anthropic-api-key
      STAGE: ${self:custom.stage}
      SEO_QUEUE_URL: !Ref SeoQueue
    events:
      - sqs:
          arn: !GetAtt EditQueue.Arn
          batchSize: 1

  # Worker function: triggered by SQS, generates SEO metadata (up to 1 min)
  seoWorker:
    handler: src/seoWorker.handler
    timeout: 60
    memorySize: 512
    environment:
      BUCKET_NAME: ${self:custom.bucketName}
      TABLE_NAME: ${self:custom.tableName}
      SECRET_ID: richcorabbithole/anthropic-api-key
      STAGE: ${self:custom.stage}
      PUBLISH_QUEUE_URL: !Ref PublishQueue
    events:
      - sqs:
          arn: !GetAtt SeoQueue.Arn
          batchSize: 1

  # Worker function: triggered by SQS, creates a PR on richcorabbithole-site (up to 1 min)
  publishWorker:
    handler: src/publishWorker.handler
    timeout: 60
    memorySize: 512
    environment:
      BUCKET_NAME: ${self:custom.bucketName}
      TABLE_NAME: ${self:custom.tableName}
      STAGE: ${self:custom.stage}
    events:
      - sqs:
          arn: !GetAtt PublishQueue.Arn
          batchSize: 1

resources:
  Resources:
    ResearchBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.bucketName}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    ApiCustomDomain:
      Type: AWS::ApiGateway::DomainName
      Properties:
        DomainName: ${self:custom.domainName}
        CertificateArn: ${self:custom.certificateArn}
        SecurityPolicy: TLS_1_2
        EndpointConfiguration:
          Types:
            - EDGE
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    ApiBasePathMapping:
      Type: AWS::ApiGateway::BasePathMapping
      DependsOn: ApiCustomDomain
      Properties:
        DomainName: ${self:custom.domainName}
        RestApiId: !Ref ApiGatewayRestApi
        Stage: ${self:custom.stage}

    # Dead letter queue for researchWorker— receives messages that failed processing after maxReceiveCount attempts
    ResearchDLQ:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-research-dlq-${self:custom.stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless
    # Dead letter queue writeWorker— receives messages that failed processing after maxReceiveCount attempts
    WriterDLQ:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-writer-dlq-${self:custom.stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Main research queue — the accept function sends messages here, the worker consumes them
    ResearchQueue:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-research-queue-${self:custom.stage}
        VisibilityTimeout: 960
        MessageRetentionPeriod: 86400
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ResearchDLQ.Arn
          maxReceiveCount: 2
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless
    # Main writing queue — the researchWorker function sends messages here, the theWriteWorker consumes them
    WriteQueue:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-writer-queue-${self:custom.stage}
        VisibilityTimeout: 960
        MessageRetentionPeriod: 86400
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt WriterDLQ.Arn
          maxReceiveCount: 2
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Dead letter queue for editWorker — receives messages that failed processing after maxReceiveCount attempts
    EditDLQ:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-edit-dlq-${self:custom.stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Main edit queue — the writeWorker sends messages here, the editWorker consumes them
    EditQueue:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-edit-queue-${self:custom.stage}
        VisibilityTimeout: 240
        MessageRetentionPeriod: 86400
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt EditDLQ.Arn
          maxReceiveCount: 2
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Dead letter queue for seoWorker — receives messages that failed processing after maxReceiveCount attempts
    SeoDLQ:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-seo-dlq-${self:custom.stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Main SEO queue — the editWorker sends messages here, the seoWorker consumes them
    SeoQueue:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-seo-queue-${self:custom.stage}
        VisibilityTimeout: 120
        MessageRetentionPeriod: 86400
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt SeoDLQ.Arn
          maxReceiveCount: 2
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Dead letter queue for publishWorker — receives messages that failed processing after maxReceiveCount attempts
    PublishDLQ:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-publish-dlq-${self:custom.stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    # Main publish queue — the seoWorker sends messages here, the publishWorker consumes them
    PublishQueue:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        QueueName: richcorabbithole-publish-queue-${self:custom.stage}
        VisibilityTimeout: 120
        MessageRetentionPeriod: 86400
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PublishDLQ.Arn
          maxReceiveCount: 2
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

    TasksTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: taskId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
        KeySchema:
          - AttributeName: taskId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: status-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Project
            Value: richcorabbithole
          - Key: Environment
            Value: ${self:custom.stage}
          - Key: ManagedBy
            Value: serverless

  Outputs:
    ApiGatewayDomainTarget:
      Description: CNAME target for Cloudflare DNS
      Value: !GetAtt ApiCustomDomain.DistributionDomainName
